<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e4f7a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ホテル予報" />
    <meta name="description" content="ホテル予報 — 日本の主要都市のホテルの空室・料金高騰を、天気予報のように2か月先まで予報。ライブ・フェス・スポーツ・展示会などの大型イベントのカレンダー付き" />
    <title>ホテル予報</title>
    <!-- 選んだ配色を、画面が描かれる前に反映する（ちらつき防止）。詳しい処理は src/theme.ts -->
    <script>
      try {
        var theme = localStorage.getItem('hotelyoho-theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {}
      // Android アプリ（Google Play 版の TWA）から開かれたか。最初の読み込みだけ referrer が android-app:// になるので、
      // そのタブの間は覚えておく（ヘルプも同じ印を見る）。アプリの中では寄付（PayPal）への案内を出さない（Google Play の決済の決まり）
      try {
        var fromApp = document.referrer.indexOf('android-app://') === 0
        if (fromApp) sessionStorage.setItem('opened-from-android-app', '1')
        if (fromApp || sessionStorage.getItem('opened-from-android-app') === '1') document.documentElement.classList.add('in-app')
      } catch (e) {
        if (document.referrer.indexOf('android-app://') === 0) document.documentElement.classList.add('in-app')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </body>
</html>
