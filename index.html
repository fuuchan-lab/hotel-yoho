    <!-- 選んだ配色を、画面が描かれる前に反映する（ちらつき防止）。詳しい処理は src/theme.ts -->
    <script>
      try {
        var theme = localStorage.getItem('hotelyoho-theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {}
    </script>
