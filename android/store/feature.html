<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Feature graphic</title>
<!-- Google Play のフィーチャーグラフィック（1024×500）。ブラウザで開いて 1024×500 で撮る -->
<style>
  html, body { margin: 0; }
  body {
    width: 1024px; height: 500px; overflow: hidden; display: flex; align-items: center; gap: 48px; padding: 0 64px; box-sizing: border-box;
    background: linear-gradient(160deg, #1a6cf0 0%, #0e4f7a 60%, #08304d 100%); color: #fff;
    font-family: "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
  }
  img { width: 280px; height: 280px; flex: none; filter: drop-shadow(0 12px 30px rgba(0, 0, 0, .4)); }
  h1 { margin: 0 0 18px; font-size: 64px; letter-spacing: .02em; line-height: 1.1; }
  h1 small { font-size: 30px; font-weight: 600; color: #cfe4ff; margin-left: 12px; }
  p { margin: 0; font-size: 28px; line-height: 1.6; color: #e1eeff; }
  .faces { margin-top: 22px; display: flex; gap: 14px; align-items: center; font-size: 20px; color: #e1eeff; }
  .faces svg { width: 44px; height: 44px; }
</style>
</head>
<body>
  <img src="icon-512.png" alt="">
  <div>
    <h1>ホテル予報<small>Hotel Forecast</small></h1>
    <p>ホテルの空室と料金の高騰を、<br>天気予報のように2か月先まで。</p>
    <div class="faces" id="faces"></div>
  </div>
</body>
</html>
