name = "hotel-yoho"
main = "src/index.js"
compatibility_date = "2026-10-01"

# いまの観測を 1 つの JSON（キー state）に保存し、すべての観測を 1 時間ごとの記録（log:YYYY-MM-DDTHH）に残す
[[kv_namespaces]]
binding = "HOTEL"
id = "99e23e9743724865a536393d528beb9d"

# 5 分ごとに楽天トラベルを 40 件ずつ検索する（index.js の scheduled）。61 都市 × 92 日を約 15 時間で一巡し、直近 1 週間は約 4.5 時間ごと
[triggers]
crons = ["*/5 * * * *"]

# 楽天ウェブサービスのアプリ ID・アクセスキーは secret で渡す（値を表示・コミットしない）:
#   npx wrangler secret put RAKUTEN_APP_ID
#   npx wrangler secret put RAKUTEN_ACCESS_KEY
# アプリに「許可されたWebサイト」を登録した場合は、同じ URL を vars に入れる（Referer として送る）
# ローカルでは worker/.dev.vars に RAKUTEN_APP_ID=... と書く（コミットしない）
[vars]
RAKUTEN_REFERER = "https://hotel-yoho.doitmyself.net/"
